<section class="notes-panel" [class.is-open]="open()">
  <button type="button" class="toggle" [attr.aria-expanded]="open()" (click)="toggle()">
    <span aria-hidden="true">{{ open() ? '▾' : '▸' }}</span>
    {{ 'notes.title' | transloco }}
    @if (saving()) {
      <span class="saving">{{ 'notes.saving' | transloco }}</span>
    }
  </button>
  @if (open()) {
    <form class="quick" (submit)="$event.preventDefault(); add()">
      @if (stamp(); as at) {
        <span class="stamp" [title]="'notes.stampHint' | transloco">[{{ at }}]</span>
      }
      <input
        type="text"
        class="quick-input"
        [value]="draft()"
        [attr.placeholder]="'notes.quickPlaceholder' | transloco"
        [attr.aria-label]="'notes.quickPlaceholder' | transloco"
        (input)="onDraft($event)"
      />
      <button type="submit" class="add" [disabled]="draft().trim() === ''">{{ 'notes.add' | transloco }}</button>
    </form>
    <div class="modes" role="tablist">
      <button type="button" role="tab" class="mode edit" [class.active]="!preview()" [attr.aria-selected]="!preview()" (click)="setPreview(false)">{{ 'notes.edit' | transloco }}</button>
      <button type="button" role="tab" class="mode show" [class.active]="preview()" [attr.aria-selected]="preview()" (click)="setPreview(true)">{{ 'notes.preview' | transloco }}</button>
    </div>
    @if (preview()) {
      @if (rendered(); as html) {
        <div class="preview" [innerHTML]="html"></div>
      } @else {
        <p class="empty">{{ 'notes.empty' | transloco }}</p>
      }
    } @else {
    <textarea
      class="text"
      rows="6"
      [value]="text()"
      [attr.placeholder]="'notes.placeholder' | transloco"
      [attr.aria-label]="'notes.title' | transloco"
      (input)="onText($event)"
    ></textarea>
    }
    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
  }
</section>
