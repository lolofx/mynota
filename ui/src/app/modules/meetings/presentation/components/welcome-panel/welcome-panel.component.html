<div class="welcome">
  <div class="welcome-content">
    <div class="mark" aria-hidden="true"></div>
    <h1>{{ 'welcome.title' | transloco }}</h1>
    <p class="hint">{{ 'welcome.hint' | transloco }}</p>
    <button
      type="button"
      class="start-meeting"
      [disabled]="actionsDisabled()"
      (click)="startRecordingRequested.emit()"
    >
      @if (startingRecording()) {
        {{ 'welcome.preparing' | transloco }}
      } @else {
        {{ 'welcome.start' | transloco }}
      }
    </button>
    <button
      type="button"
      class="import-recording"
      [disabled]="actionsDisabled()"
      (click)="importRequested.emit()"
    >
      {{ 'welcome.import' | transloco }}
    </button>
  </div>
</div>
